---
name: ARM Platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Bootstrap CI dependencies
        run: bash scripts/ci/bootstrap.sh

      - name: Validate repository
        run: bash scripts/ci/validate.sh

      - name: Validate Dockerfile
        run: |
          docker buildx build \
            --check \
            --platform linux/arm64 \
            ./apps/platform-hello

  build-hello:
    name: Build and test ARM64 Hello World
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    permissions:
      contents: read

    env:
      IMAGE_REF: platform-hello:${{ github.sha }}

    steps:
      - name: Checkout application source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build ARM64 Hello World image
        run: bash scripts/ci/build-hello.sh "$IMAGE_REF"

      - name: Test built Hello World image
        run: bash scripts/ci/test-hello.sh "$IMAGE_REF"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.74.0
          cache: true

      - name: Scan tested Hello World image
        run: bash scripts/ci/scan-hello.sh "$IMAGE_REF"
