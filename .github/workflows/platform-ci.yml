---
name: ARM Platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Bootstrap CI dependencies
        run: bash scripts/ci/bootstrap.sh

      - name: Validate repository
        run: bash scripts/ci/validate.sh

      - name: Validate Dockerfile
        run: |
          docker buildx build \
            --check \
            --platform linux/arm64 \
            ./apps/platform-hello

  build-hello:
    name: Build and test ARM64 Hello World
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    permissions:
      contents: read

    env:
      IMAGE_REF: platform-hello:${{ github.sha }}

    steps:
      - name: Checkout application source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build ARM64 Hello World image
        run: bash scripts/ci/build-hello.sh "$IMAGE_REF"

      - name: Test built Hello World image
        run: bash scripts/ci/test-hello.sh "$IMAGE_REF"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.74.0
          cache: true

      - name: Scan tested Hello World image
        run: bash scripts/ci/scan-hello.sh "$IMAGE_REF"

      - name: Export tested and scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          bash scripts/ci/export-image.sh \
            "$IMAGE_REF" \
            ci-artifacts

      - name: Upload tested and scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: platform-hello-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-hello:
    name: Publish verified ARM64 image to GHCR
    needs: build-hello

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    env:
      LOCAL_IMAGE_REF: platform-hello:${{ github.sha }}
      GHCR_IMAGE_REF: ghcr.io/ctalaveraw/platform-hello:${{ github.sha }}

    steps:
      - name: Checkout publication scripts
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download tested and scanned image
        uses: actions/download-artifact@v5
        with:
          name: platform-hello-${{ github.sha }}
          path: ci-artifacts

      - name: Verify transferred image
        run: |
          bash scripts/ci/verify-image-transfer.sh \
            "$LOCAL_IMAGE_REF" \
            ci-artifacts

      - name: Authenticate to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Publish verified image
        run: |
          bash scripts/ci/publish-image.sh \
            "$LOCAL_IMAGE_REF" \
            "$GHCR_IMAGE_REF"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true
