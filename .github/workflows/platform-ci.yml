---
name: ARM Platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap CI dependencies
        run: bash scripts/ci/bootstrap.sh

      - name: Validate repository
        run: bash scripts/ci/validate.sh
