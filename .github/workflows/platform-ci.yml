---
name: ARM Platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap CI dependencies
        run: bash scripts/ci/bootstrap.sh

      - name: Validate repository
        run: bash scripts/ci/validate.sh

  build-hello:
    name: Build and test ARM64 Hello World
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and test Hello World
        run: bash scripts/ci/test-hello.sh
