---
- import_playbook: 00-preflight.yml

- name: Prepare controller Cloudflare Tunnel and Caddy
  hosts: management
  gather_facts: false
  become: true

  tasks:
    - name: Prepare public ingress and credential storage
      ansible.builtin.file:
        path: "/srv/storage/state/services/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - caddy-public
        - caddy-public/data
        - caddy-public/config
        - cloudflared
        - zulip

    - name: Inspect Zulip data directories without changing service ownership
      ansible.builtin.stat:
        path: "/srv/storage/state/services/zulip/{{ item }}"
      loop: [data, postgresql, rabbitmq, redis]
      register: zulip_directories

    - name: Create missing Zulip data directories
      ansible.builtin.file:
        path: "/srv/storage/state/services/zulip/{{ item.item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop: "{{ zulip_directories.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not item.stat.exists

    - name: Install controller Zulip operator helpers
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname | dirname }}/scripts/zulip/{{ item.source }}"
        dest: "/usr/local/sbin/{{ item.target }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - {source: init-secrets.py, target: zulip-init-secrets}
        - {source: compose.sh, target: zulip-compose}

    - name: Install hidden-input token helper
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname | dirname }}/scripts/cloudflared/install-token.py"
        dest: /usr/local/sbin/cloudflared-install-token
        owner: root
        group: root
        mode: '0755'

    - name: Install public ingress storage guard
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname | dirname }}/compose/caddy-public/check-storage.py"
        dest: /usr/local/sbin/caddy-public-check-storage
        owner: root
        group: root
        mode: '0755'

    - name: Install public ingress lifecycle unit
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname | dirname }}/compose/caddy-public/caddy-public.service"
        dest: /etc/systemd/system/caddy-public.service
        owner: root
        group: root
        mode: '0644'
      notify: Reload systemd

    - name: Apply pending unit changes
      ansible.builtin.meta: flush_handlers

    - name: Enable and start reviewed public tunnel
      ansible.builtin.systemd_service:
        name: caddy-public.service
        enabled: true
        state: started
      when: public_ingress_activate | default(false) | bool

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
