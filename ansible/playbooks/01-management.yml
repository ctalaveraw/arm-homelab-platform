---
- import_playbook: 00-preflight.yml

- name: Configure R5C management host
  hosts: management
  gather_facts: false
  become: true

  roles:
    - common
    - docker_host
    - kubernetes_client

  tasks:
    - name: Ensure services directory exists
      ansible.builtin.file:
        path: /srv/services
        state: directory
        owner: runner
        group: runner
        mode: '0750'

    - name: Ensure services backup directory exists
      ansible.builtin.file:
        path: /srv/backups
        state: directory
        owner: runner
        group: runner
        mode: '0750'

    - name: Ensure services storage namespace directory exists
      ansible.builtin.file:
        path: /srv/storage
        state: directory
        owner: runner
        group: runner
        mode: '0750'
