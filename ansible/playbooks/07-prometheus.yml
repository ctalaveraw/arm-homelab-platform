---
- import_playbook: 00-preflight.yml

- name: Configure Prometheus on the R5C
  hosts: management
  gather_facts: false
  become: true

  tasks:
    - name: Ensure persistent services directory exists
      ansible.builtin.file:
        path: /srv/storage/state/services
        state: directory
        owner: runner
        group: runner
        mode: '0750'

    - name: Ensure Prometheus persistent directory exists
      ansible.builtin.file:
        path: /srv/storage/state/services/prometheus
        state: directory
        owner: '65534'
        group: '65534'
        mode: '0750'

    - name: Ensure dedicated monitoring runtime group
      ansible.builtin.group:
        name: prometheus-observer
        gid: 29012
        system: true

    - name: Inspect protected observer originals
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /home/runner/.kube/platform-observer/client.key
        - /home/runner/.kube/platform-observer/client.crt
        - /home/runner/.kube/platform-observer/ca.crt
      register: observer_sources
      no_log: true

    - name: Reject unsafe original monitoring credentials
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.pw_name == 'runner'
          - item.stat.mode == '0600'
      loop: "{{ observer_sources.results }}"
      no_log: true

    - name: Create isolated observer runtime credential directory
      ansible.builtin.file:
        path: /srv/storage/state/services/prometheus-auth
        state: directory
        follow: false
        owner: root
        group: prometheus-observer
        mode: '0750'

    - name: Install protected observer runtime copies
      ansible.builtin.copy:
        src: "/home/runner/.kube/platform-observer/{{ item }}"
        dest: "/srv/storage/state/services/prometheus-auth/{{ item }}"
        remote_src: true
        owner: root
        group: prometheus-observer
        mode: '0640'
      loop:
        - client.key
        - client.crt
        - ca.crt
      no_log: true
      notify: Restart Prometheus

    - name: Install Prometheus storage guard
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname | dirname }}/compose/observability/check-storage.py"
        dest: /usr/local/sbin/prometheus-check-storage
        owner: root
        group: root
        mode: '0755'
      notify: Restart Prometheus

    - name: Install Prometheus systemd unit
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname | dirname }}/compose/observability/prometheus.service"
        dest: /etc/systemd/system/prometheus.service
        owner: root
        group: root
        mode: '0644'
      notify: Reload systemd

    - name: Validate Prometheus Compose configuration
      ansible.builtin.command:
        argv:
          - /usr/bin/docker-compose
          - --env-file
          - /dev/null
          - -f
          - /srv/platform/compose/observability/compose.yml
          - config
          - --quiet
      environment:
        STATE_SERVICES_ROOT: /srv/storage/state/services
      changed_when: false

    - name: Inspect Prometheus configuration without following links
      ansible.builtin.stat:
        path: /srv/platform/compose/observability/prometheus.yml
        follow: false
      register: prometheus_config_stat

    - name: Reject missing or symlinked Prometheus configuration
      ansible.builtin.assert:
        that:
          - prometheus_config_stat.stat.isreg | default(false)
          - not (prometheus_config_stat.stat.islnk | default(false))

    - name: Enforce readable Prometheus configuration
      ansible.builtin.file:
        path: /srv/platform/compose/observability/prometheus.yml
        state: file
        follow: false
        owner: runner
        group: runner
        mode: '0644'
      notify: Restart Prometheus

    - name: Verify runtime observer credentials with storage guard
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/prometheus-check-storage
      changed_when: false

    - name: Track Prometheus scrape configuration
      ansible.builtin.copy:
        dest: /etc/observability-prometheus-config.sha256
        content: >-
          {{ lookup('file',
          (playbook_dir | dirname | dirname) ~
          '/compose/observability/prometheus.yml') | hash('sha256') }}
        owner: root
        group: root
        mode: '0644'
      notify: Restart Prometheus

    - name: Track Prometheus Compose deployment configuration
      ansible.builtin.copy:
        dest: /etc/observability-prometheus-compose.sha256
        content: >-
          {{ lookup('file',
          (playbook_dir | dirname | dirname) ~
          '/compose/observability/compose.yml') | hash('sha256') }}
        owner: root
        group: root
        mode: '0644'
      notify: Restart Prometheus

    - name: Apply pending Prometheus restart
      ansible.builtin.meta: flush_handlers

    - name: Enable and start guarded Prometheus
      ansible.builtin.systemd_service:
        name: prometheus.service
        enabled: true
        state: started

    - name: Verify Prometheus HTTP readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/-/ready
        method: GET
        status_code: 200
        use_proxy: false
        timeout: 2
      register: prometheus_readiness
      until: prometheus_readiness.status | default(0) == 200
      retries: 15
      delay: 2
      changed_when: false

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart Prometheus
      ansible.builtin.systemd_service:
        name: prometheus.service
        state: restarted
