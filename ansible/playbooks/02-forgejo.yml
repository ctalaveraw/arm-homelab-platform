---
- import_playbook: 00-preflight.yml

- name: Prepare Forgejo persistent storage
  hosts: management
  gather_facts: false
  become: true

  tasks:
    - name: Ensure persistent services namespace exists
      ansible.builtin.file:
        path: /srv/storage/state/services
        state: directory
        owner: runner
        group: runner
        mode: '0750'

    - name: Ensure Forgejo persistent directory exists
      ansible.builtin.file:
        path: /srv/storage/state/services/forgejo
        state: directory
        owner: runner
        group: runner
        mode: '0750'

    # Install the executable that validates the SD filesystem
    # and checks Forgejo's resolved Compose volume configuration.
    - name: Install Forgejo storage preflight executable
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname | dirname }}/compose/forgejo/check-storage.py"
        dest: /usr/local/sbin/forgejo-check-storage
        owner: root
        group: root
        mode: '0755'

    # Install the systemd lifecycle definition separately.
    - name: Install Forgejo systemd unit
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname | dirname }}/compose/forgejo/forgejo.service"
        dest: /etc/systemd/system/forgejo.service
        owner: root
        group: root
        mode: '0644'
      notify: Reload systemd


    # Apply the newly installed unit before activation.
    - name: Apply pending Forgejo unit changes
      ansible.builtin.meta: flush_handlers

    # Fail before activation if host-specific configuration is invalid.
    - name: Validate Forgejo Compose configuration
      ansible.builtin.command:
        argv:
          - /usr/bin/docker-compose
          - --env-file
          - /srv/platform/compose/forgejo/.env
          - -f
          - /srv/platform/compose/forgejo/compose.yml
          - config
          - --quiet
      changed_when: false
      no_log: true

    # Ansible owns both current state and boot enablement.
    - name: Enable and start Forgejo
      ansible.builtin.systemd_service:
        name: forgejo.service
        enabled: true
        state: started

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
