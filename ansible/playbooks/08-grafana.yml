---
- import_playbook: 00-preflight.yml

- name: Configure Grafana on the R5C
  hosts: management
  gather_facts: false
  become: true

  tasks:
    - name: Ensure persistent services root exists
      ansible.builtin.file:
        path: /srv/storage/state/services
        state: directory
        owner: runner
        group: runner
        mode: '0750'

    - name: Ensure Grafana data directory exists
      ansible.builtin.file:
        path: /srv/storage/state/services/grafana
        state: directory
        owner: '472'
        group: '472'
        mode: '0750'

    - name: Ensure protected Grafana secret directory exists
      ansible.builtin.file:
        path: /srv/storage/state/services/grafana-auth
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Inspect existing Grafana bootstrap secret
      ansible.builtin.stat:
        path: /srv/storage/state/services/grafana-auth/admin-password
        follow: false
      register: grafana_secret

    - name: Reject symlinked or nonregular bootstrap secret
      ansible.builtin.assert:
        that:
          - >-
            not grafana_secret.stat.exists or
            (grafana_secret.stat.isreg | default(false))
          - not (grafana_secret.stat.islnk | default(false))

    - name: Generate initial Grafana secret exactly once
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import os
            import secrets
            import stat
            import subprocess
            from pathlib import Path

            mount = Path("/srv/storage/state")
            parent = mount / "services/grafana-auth"
            destination = parent / "admin-password"

            label = subprocess.check_output(
                [
                    "/usr/bin/findmnt", "--kernel", "--mountpoint",
                    str(mount), "--types", "ext4",
                    "--noheadings", "--output", "LABEL",
                ],
                text=True,
            ).strip()
            if label != "storage_sdcard":
                raise SystemExit("Refusing secret creation outside SD")

            if parent.is_symlink() or parent.resolve() != parent:
                raise SystemExit("Unsafe secret directory")

            info = parent.stat()
            if (
                not stat.S_ISDIR(info.st_mode)
                or info.st_uid != 0
                or info.st_gid != 0
                or stat.S_IMODE(info.st_mode) != 0o700
            ):
                raise SystemExit("Unsafe secret directory permissions")

            backing = subprocess.check_output(
                [
                    "/usr/bin/findmnt", "--kernel", "--target",
                    str(parent), "--types", "ext4",
                    "--noheadings", "--output", "TARGET,LABEL",
                ],
                text=True,
            ).split()
            if backing != [str(mount), "storage_sdcard"]:
                raise SystemExit("Secret directory is not SD-backed")

            fd = os.open(
                destination,
                os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                0o400,
            )
            try:
                os.fchown(fd, 472, 472)
                os.fchmod(fd, 0o400)
                payload = secrets.token_urlsafe(48).encode("ascii")
                if os.write(fd, payload) != len(payload):
                    raise SystemExit("Incomplete secret write")
                os.fsync(fd)
            finally:
                os.close(fd)
        creates: /srv/storage/state/services/grafana-auth/admin-password
      no_log: true

    - name: Inspect Grafana provisioning files without following links
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /srv/platform/compose/observability/grafana/provisioning/datasources/prometheus.yml
        - /srv/platform/compose/observability/grafana/provisioning/dashboards/platform.yml
        - /srv/platform/compose/observability/grafana/dashboards/platform-overview.json
        - /srv/platform/compose/observability/grafana/dashboards/r5c-host.json
      register: grafana_provisioning

    - name: Reject missing or symlinked provisioning files
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
      loop: "{{ grafana_provisioning.results }}"

    - name: Enforce readable provisioning files
      ansible.builtin.file:
        path: "{{ item }}"
        state: file
        follow: false
        owner: runner
        group: runner
        mode: '0644'
      loop:
        - /srv/platform/compose/observability/grafana/provisioning/datasources/prometheus.yml
        - /srv/platform/compose/observability/grafana/provisioning/dashboards/platform.yml
        - /srv/platform/compose/observability/grafana/dashboards/platform-overview.json
        - /srv/platform/compose/observability/grafana/dashboards/r5c-host.json
      notify: Restart Grafana

    - name: Install Grafana storage guard
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname | dirname }}/compose/observability/grafana-check-storage.py"
        dest: /usr/local/sbin/grafana-check-storage
        owner: root
        group: root
        mode: '0755'
      notify: Restart Grafana

    - name: Install Grafana systemd unit
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname | dirname }}/compose/observability/grafana.service"
        dest: /etc/systemd/system/grafana.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload systemd
        - Restart Grafana

    - name: Validate Grafana Compose rendering
      ansible.builtin.command:
        argv:
          - /usr/bin/docker-compose
          - --env-file
          - /dev/null
          - -f
          - /srv/platform/compose/observability/compose.yml
          - config
          - --quiet
      environment:
        STATE_SERVICES_ROOT: /srv/storage/state/services
      changed_when: false

    - name: Track Grafana Compose deployment configuration
      ansible.builtin.copy:
        dest: /etc/observability-grafana-compose.sha256
        content: >-
          {{ lookup('file',
          (playbook_dir | dirname | dirname) ~
          '/compose/observability/compose.yml') | hash('sha256') }}
        owner: root
        group: root
        mode: '0644'
      notify: Restart Grafana

    - name: Apply pending unit updates
      ansible.builtin.meta: flush_handlers

    - name: Enable and start Grafana through systemd
      ansible.builtin.systemd_service:
        name: grafana.service
        enabled: true
        state: started

    - name: Verify Grafana HTTP readiness
      ansible.builtin.uri:
        url: http://10.0.0.50:3300/api/health
        method: GET
        status_code: 200
        use_proxy: false
        timeout: 3
      register: grafana_health
      until: grafana_health.status | default(0) == 200
      retries: 30
      delay: 2
      changed_when: false

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart Grafana
      ansible.builtin.systemd_service:
        name: grafana.service
        state: restarted
