---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-deployer
  namespace: platform-demo
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch

  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch

  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-deployer
  namespace: platform-demo
subjects:
  - kind: User
    name: platform-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: platform-deployer
  apiGroup: rbac.authorization.k8s.io
