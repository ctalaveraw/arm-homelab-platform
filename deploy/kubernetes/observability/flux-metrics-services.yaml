---
apiVersion: v1
kind: Service
metadata:
  name: flux-source-metrics
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: arm-homelab-platform
spec:
  type: ClusterIP
  selector:
    app: source-controller
  ports:
    - name: metrics
      protocol: TCP
      port: 8080
      targetPort: http-prom
---
apiVersion: v1
kind: Service
metadata:
  name: flux-kustomize-metrics
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: arm-homelab-platform
spec:
  type: ClusterIP
  selector:
    app: kustomize-controller
  ports:
    - name: metrics
      protocol: TCP
      port: 8080
      targetPort: http-prom
