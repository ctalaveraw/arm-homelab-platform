apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-hello
  namespace: platform-demo
  labels:
    app.kubernetes.io/name: platform-hello
    app.kubernetes.io/part-of: arm-homelab-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-hello
        app.kubernetes.io/part-of: arm-homelab-platform
    spec:
      containers:
        - name: platform-hello
          image: ghcr.io/ctalaveraw/platform-hello@sha256:f3c542d3bbc8599f83019263899c2396f6f7aadbda781f329d5a0fa17afaa61e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
