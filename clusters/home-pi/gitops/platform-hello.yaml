apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-hello
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 2m
  wait: true
  prune: true
  deletionPolicy: Orphan

  sourceRef:
    kind: GitRepository
    name: arm-homelab-platform

  path: ./deploy/kubernetes/platform-hello

  serviceAccountName: platform-hello-reconciler
