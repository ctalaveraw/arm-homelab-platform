---
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
  - job_name: r5c
    static_configs:
      - targets:
          - 10.0.0.50:9100
  - job_name: pi-nodes
    static_configs:
      - targets:
          - 10.0.0.5:9100
        labels:
          node: ci-controller-01
          role: control-plane
      - targets:
          - 10.0.0.6:9100
        labels:
          node: ci-controller-02
          role: worker
      - targets:
          - 10.0.0.8:9100
        labels:
          node: ci-controller-04
          role: worker

  - job_name: kubernetes-apiserver
    scheme: https
    scrape_interval: 60s
    scrape_timeout: 20s
    metrics_path: /metrics
    sample_limit: 5000
    tls_config: &observer_tls
      ca_file: /run/secrets/platform-observer/ca.crt
      cert_file: /run/secrets/platform-observer/client.crt
      key_file: /run/secrets/platform-observer/client.key
    static_configs:
      - targets: [10.0.0.5:6443]
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: 'apiserver_request_(total|duration_seconds_(sum|count))|apiserver_current_inflight_requests'

  - job_name: flux-source-controller
    scheme: https
    scrape_interval: 60s
    scrape_timeout: 20s
    metrics_path: /api/v1/namespaces/flux-system/services/http:flux-source-metrics:metrics/proxy/metrics
    sample_limit: 1500
    tls_config: *observer_tls
    static_configs:
      - targets: [10.0.0.5:6443]
    metric_relabel_configs: &flux_keep
      - source_labels: [__name__]
        action: keep
        regex: 'gotk_.*|controller_runtime_reconcile_(total|errors_total)|workqueue_depth|go_goroutines'

  - job_name: flux-kustomize-controller
    scheme: https
    scrape_interval: 60s
    scrape_timeout: 20s
    metrics_path: /api/v1/namespaces/flux-system/services/http:flux-kustomize-metrics:metrics/proxy/metrics
    sample_limit: 1500
    tls_config: *observer_tls
    static_configs:
      - targets: [10.0.0.5:6443]
    metric_relabel_configs: *flux_keep
