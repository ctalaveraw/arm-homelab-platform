---
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
  - job_name: r5c
    static_configs:
      - targets:
          - 10.0.0.50:9100
  - job_name: pi-nodes
    static_configs:
      - targets:
          - 10.0.0.5:9100
        labels:
          node: ci-controller-01
          role: control-plane
      - targets:
          - 10.0.0.6:9100
        labels:
          node: ci-controller-02
          role: worker
      - targets:
          - 10.0.0.8:9100
        labels:
          node: ci-controller-04
          role: worker
