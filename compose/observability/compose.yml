---
name: observability

services:
  grafana:
    image: grafana/grafana:13.2.2
    restart: "no"
    user: "472:472"

    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL

    read_only: true
    mem_limit: 768m
    pids_limit: 256

    tmpfs:
      - /tmp:size=64m,mode=1777

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_DISABLE_PLUGINS: >-
        elasticsearch,grafana-postgresql-datasource,
        grafana-pyroscope-datasource,influxdb,jaeger,loki,
        mssql,mysql,opentsdb,stackdriver,tempo,zipkin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/platform-overview.json
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_PATHS_LOGS: /var/lib/grafana/logs
      GF_LOG_MODE: console

    ports:
      - "10.0.0.50:3300:3000"

    volumes:
      - type: bind
        source: ${STATE_SERVICES_ROOT:?Set STATE_SERVICES_ROOT}/grafana
        target: /var/lib/grafana
        bind:
          create_host_path: false

      - type: bind
        source: ${STATE_SERVICES_ROOT:?Set STATE_SERVICES_ROOT}/grafana-auth/admin-password
        target: /run/secrets/grafana-admin-password
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: "no"

    user: "65534:65534"

    security_opt:
      - "no-new-privileges:true"

    cap_drop:
      - ALL

    read_only: true
    mem_limit: 384m
    pids_limit: 128

    tmpfs:
      - /tmp:size=16m,mode=1777

    ports:
      - "127.0.0.1:9090:9090"

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=48h
      - --storage.tsdb.retention.size=512MB
      - --web.listen-address=0.0.0.0:9090

    volumes:
      - type: bind
        source: ${STATE_SERVICES_ROOT:?Set STATE_SERVICES_ROOT}/prometheus
        target: /prometheus
        bind:
          create_host_path: false

      - type: bind
        source: ./prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
