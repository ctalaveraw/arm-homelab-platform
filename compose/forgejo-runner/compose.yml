---
name: forgejo-runner

services:
  runner:
    image: localhost/platform-forgejo-runner:dev
    pull_policy: never
    restart: "no"

    user: "10001:10001"
    working_dir: /data
    command: ["daemon", "--config", "/data/runner.yml"]

    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    pids_limit: 256

    volumes:
      - type: bind
        source: "${STATE_SERVICES_ROOT:?Set STATE_SERVICES_ROOT}/forgejo-runner"
        target: /data
        bind:
          create_host_path: false

    networks:
      - forgejo_internal

networks:
  forgejo_internal:
    external: true
    name: forgejo_default
