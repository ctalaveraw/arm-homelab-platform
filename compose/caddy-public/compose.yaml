---
name: caddy-public

services:
  server:
    image: caddy:2.11.9-alpine
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    environment:
      ZULIP_FQDN: "${ZULIP_FQDN:?Set ZULIP_FQDN}"
      ZULIP_UPSTREAM: "${ZULIP_UPSTREAM:?Set ZULIP_UPSTREAM}"
      CLOUDFLARED_CONTAINER_IP: "${CLOUDFLARED_CONTAINER_IP:?Set CLOUDFLARED_CONTAINER_IP}"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${STATE_SERVICES_ROOT:?Set STATE_SERVICES_ROOT}/caddy-public/data"
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: "${STATE_SERVICES_ROOT:?Set STATE_SERVICES_ROOT}/caddy-public/config"
        target: /config
        bind:
          create_host_path: false
    tmpfs: [/tmp]
    networks:
      tunnel:
        ipv4_address: "${CADDY_TUNNEL_IP:?Set CADDY_TUNNEL_IP}"
      backend_egress: {}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    user: "65532:65532"
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - warn
      - --metrics
      - 127.0.0.1:2000
      - --management-diagnostics=false
      - run
      - --token-file
      - /run/secrets/tunnel_token
    secrets: [tunnel_token]
    depends_on: [server]
    tmpfs: [/tmp]
    networks:
      tunnel:
        ipv4_address: "${CLOUDFLARED_CONTAINER_IP:?Set CLOUDFLARED_CONTAINER_IP}"
      edge_egress: {}
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, '127.0.0.1:2000', ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

networks:
  tunnel:
    internal: true
    ipam:
      config:
        - subnet: "${PUBLIC_INGRESS_SUBNET:?Set PUBLIC_INGRESS_SUBNET}"
  backend_egress: {}
  edge_egress: {}

secrets:
  tunnel_token:
    file: "${STATE_SERVICES_ROOT:?Set STATE_SERVICES_ROOT}/cloudflared/tunnel-token"
